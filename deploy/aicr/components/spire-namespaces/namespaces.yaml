# The SPIRE namespaces, with their Pod Security levels. The spire release
# installs into spire-server and also creates objects in spire-system, the
# agent's namespace. The agent and the CSI driver mount host paths, so
# spire-system is privileged.
apiVersion: v1
kind: Namespace
metadata:
  name: spire-server
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: spire-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
