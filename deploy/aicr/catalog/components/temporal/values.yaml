# Values for the upstream Temporal chart on the seed cluster.
# The host is the Service of the postgres release in the postgres namespace.
#
# The password comes from the nvke-database Secret in the temporal namespace.
# The operator creates it before the install. Its key is postgres-password.
server:
  configMapsToMount: sprig
  setConfigFilePath: true
  config:
    persistence:
      driver: sql
      default:
        driver: sql
        sql:
          driver: postgres12
          host: postgres-postgresql.postgres.svc.cluster.local
          port: 5432
          database: temporal
          user: postgres
          existingSecret: nvke-database
          secretKey: postgres-password
          maxConns: 10
          maxIdleConns: 5
      visibility:
        driver: sql
        sql:
          driver: postgres12
          host: postgres-postgresql.postgres.svc.cluster.local
          port: 5432
          database: temporal_visibility
          user: postgres
          existingSecret: nvke-database
          secretKey: postgres-password
          maxConns: 10
          maxIdleConns: 5

cassandra:
  enabled: false

mysql:
  enabled: false

postgresql:
  enabled: false

prometheus:
  enabled: false

grafana:
  enabled: false

elasticsearch:
  enabled: false

schema:
  createDatabase:
    enabled: true
  setup:
    enabled: true
  update:
    enabled: true
