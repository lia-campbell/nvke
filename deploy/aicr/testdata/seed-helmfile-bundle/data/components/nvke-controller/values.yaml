# Values for the in-repo controller chart on the seed cluster.
#
# image.repository and image.digest come from the artifact inventory.
# The trust domain, the API port and the VIP switch are install-time values.
# See config/seed.yaml. The values here are the seed defaults.

# These four names match the namespace and the NodePort Service selector.
fullnameOverride: nvke-controller
nameOverride: nvke-controller
namespaceOverride: nvke-controller
serviceAccount:
  name: nvke-controller

image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

# The NodePort Service publishes the API on the same port.
service:
  port: 30080

metrics:
  networkPolicy:
    enabled: false
serviceMonitor:
  enabled: false

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# The chart reads the connection string from the nvke-database Secret.
# The operator creates it in the nvke-controller namespace before the install.
# With dbSecretName set, the chart reads no password from appDb.
secrets:
  createDbSecret: false
  dbSecretName: nvke-database
  dbSecretKey: database-connection-string
  dgxcTenantCredSecretName: ""

appDb:
  url: postgres-postgresql.postgres.svc.cluster.local:5432
  dbName: nvke-controller
  postgresUser: postgres
  sslMode: disable

temporal:
  host: temporal-frontend.temporal.svc.cluster.local
  port: 7233

# The address is the Service of the spire release in the spire-server namespace.
# className matches the SPIRE controller manager's class.
# trustDomain matches global.spire.trustDomain of the spire release.
spiffe:
  enabled: true
  trustDomain: nvkectl-bootstrap.nke.local
  spire:
    className: spire-mgmt-spire
    serverAddress: spire-server.spire-server.svc.cluster.local
    serverPort: "8081"

nvkeOIDCAuth:
  enabled: false

profiles:
  path: /profiles

cni:
  installAfterInit: true

allowControlPlaneWithoutVIP: false

# This stack installs no Cluster API provider.
# The values stay as the seed sets them for its default provider.
supportedInfraProviders: infra
controllers:
  nico:
    enabled: false
capi:
  enabled: true
  rbac:
    create: true
