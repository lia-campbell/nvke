# Publishes the controller API on a NodePort.
# The host that bootstraps the site calls the API through it.
# The chart's own Service has no nodePort field, so this is a second Service.
# The selector matches the labels the chart puts on the controller pods.
{{- $controller := index .Values "nvke-controller" }}
apiVersion: v1
kind: Service
metadata:
  name: nvke-controller-external
  namespace: nvke-controller
  labels:
    app.kubernetes.io/name: nvke-controller
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nvke-controller
    app.kubernetes.io/instance: nvke-controller
  ports:
    - name: http
      protocol: TCP
      targetPort: http
      port: {{ $controller.service.port }}
      nodePort: {{ $controller.service.port }}
