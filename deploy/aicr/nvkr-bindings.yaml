# Binds NVKR release outputs to this catalog. deploy/aicr-resolve.sh reads it.
#
# A chart binding names a registry entry. The resolve sets its repository,
# chart, version and archive digest from the output. valuesWrittenFor is the
# chart version the values file under components/ was written against. It is
# not a source. The resolve compares it with the output's chartVersion and
# warns on a mismatch, or fails with --strict.
#
# An image binding names a values file and two keys in it. The resolve writes
# the repository and the digest of the output's reference there.
#
# An image output the release does not carry keeps the template's value. A
# required one fails the resolve. A chart no output resolves fails it too: the
# template has no repository or version for it.
charts:
  - output: controller-chart
    component: nvke-controller
    valuesWrittenFor: "0.3.1-rc.1"
    required: true
  - output: nktp
    component: nktp
    valuesWrittenFor: "0.1.1-rc.3"
  - output: postgresql
    component: postgresql
    valuesWrittenFor: "18.5.15"
  - output: spire-crds
    component: spire-crds
    valuesWrittenFor: "0.6.1"
  - output: spire
    component: spire
    valuesWrittenFor: "0.30.1"
  - output: temporal
    component: temporal
    valuesWrittenFor: "0.74.0"
images:
  - output: cwe
    valuesFile: components/nvke-controller/values.yaml
    repository: .image.repository
    digest: .image.digest
    required: true
  - output: controller-profiles
    valuesFile: components/nvke-controller/values.yaml
    repository: .profiles.image.repository
    digest: .profiles.image.digest
